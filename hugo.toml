# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 7.09:1, bright on the dark background 8.99:1.
  base = "#92400e"
  deep = "#592709"
  bright = "#f59e0b"
  shadow = "rgba(146,64,14,.7)"
  glow = "rgba(146,64,14,.6)"
  wash = "rgba(146,64,14,.10)"
  washDeep = "rgba(89,39,9,.06)"
  chipBg = "#fef3e2"
  chipBorder = "#fce2b6"
  chipFg = "#592709"
  chipBgDark = "rgba(245,158,11,.14)"
  chipBorderDark = "rgba(245,158,11,.32)"
  chipFgDark = "#faca79"
  statsEnd = "#fde8c4"
  bandText = "#fdefd8"
